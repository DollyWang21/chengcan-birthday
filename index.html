<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<meta name="format-detection" content="telephone=no,email=no,address=no">
<meta name="theme-color" content="#241B17">
<title>成灿的21岁生日礼物</title>
<meta name="description" content="11 月 17 日零点，礼物送达。">
<meta property="og:type" content="website">
<meta property="og:title" content="成灿的21岁生日礼物">
<meta property="og:description" content="11 月 17 日零点，礼物送达。">
<meta property="og:image" content="assets/share.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="preload" href="assets/fonts/chengcan-title.woff2?v=20261115b" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/chengcan-hand.woff2?v=20261115b" as="font" type="font/woff2" crossorigin>
<link rel="preload" as="image" href="assets/arts/ch-23.webp">
<link rel="stylesheet" href="css/style.css?v=20261116b">
<link rel="stylesheet" href="css/theme.css?v=20261115a">
</head>
<body>
<div id="phone">

  <div id="veil" aria-hidden="true"><i class="veil-flame"></i></div>

  <div class="room" aria-hidden="true">
    <img class="window-art" id="windowArt" src="assets/arts/prop-window.webp" alt="窗" role="button" tabindex="0">
    <div class="wall-stars"></div>
    <div class="beam"></div>
    <div class="lampglow"></div>
  </div>

  <div class="rope-strip" id="ropeStrip">
    <div class="rope-track" id="ropeTrack"></div>
  </div>

  <main id="home" class="scene is-active">
    <img class="ch" id="homeCh" src="assets/arts/ch-23.webp" alt="" draggable="false">
  </main>

  <div class="desk"></div>

  <div class="props">

    <button class="obj obj-cake" data-open="cake" aria-label="蛋糕">
      <img class="art" src="assets/arts/prop-cake-new.webp" alt="">
      <span class="obj-name">蛋糕</span>
    </button>

    <button class="obj obj-wood" data-open="wood" aria-label="木鱼">
      <img class="art" src="assets/arts/prop-woodfish.webp" alt="">
      <img class="mallet-mini" src="assets/arts/prop-mallet.webp" alt="" aria-hidden="true">
      <span class="obj-name">木鱼</span>
    </button>

    <button class="obj obj-sign" data-open="sign" aria-label="签筒">
      <img class="art" src="assets/arts/prop-sign.webp" alt="">
      <span class="obj-name">签筒</span>
    </button>

    <button class="obj obj-cam" data-open="album" aria-label="相册">
      <img class="art" src="assets/arts/prop-camera.webp" alt="">
      <span class="obj-name">相册</span>
    </button>

    <div class="obj obj-note">
      <button class="hit note-hit" data-open="read" aria-label="看本子">
        <img class="art" src="assets/arts/prop-book.webp" alt="">
      </button>
      <button class="hit pencil-hit" data-open="write" aria-label="写东西">
        <img src="assets/arts/prop-pencil.webp" alt="">
      </button>
      <span class="obj-name">本子</span>
    </div>

    <button class="egg egg-envelope" id="eggEnvelope" aria-label="星星信封"><img src="assets/arts/prop-envelope.webp" alt=""></button>
    <div class="cake-spot" id="cakeSpot" aria-hidden="true"></div>
    <svg class="home-flame" id="homeFlame" viewBox="0 0 40 74" aria-hidden="true">
      <path d="M20 2c11 17 13 30 0 40c-13-10-11-23 0-40z" fill="#FFB347"/>
      <path d="M20 16c5.5 9 5.5 16 0 21c-5.5-5-5.5-12 0-21z" fill="#FFF0C9"/>
    </svg>
    <button class="cat-home" id="catBtn" aria-label="猫"><img id="catImg" src="assets/arts/cat-31.webp" alt="猫" draggable="false"></button>
    <img class="yarn" src="assets/arts/prop-yarn.webp" alt="" aria-hidden="true">
  </div>


  <div id="gate" hidden>
    <img class="gift" id="gift" src="assets/arts/prop-gift.webp" alt="生日礼物">
    <p class="gate-hint" id="gateHint">点一下看看</p>
  </div>

  <button class="egg plane-btn" id="planeBtn" aria-label="返回">
    <img src="assets/arts/prop-plane.webp" alt="">
  </button>

  <div class="layer" id="layer" hidden>
    <div class="scrim" data-close></div>
    <button class="back" data-close aria-label="返回">←</button>
    <div class="layer-body" id="layerBody"></div>
  </div>

  <div class="overlay" id="welcome" hidden>
    <div class="w-card">
      <img class="w-ch" src="assets/arts/ch-eye-23.webp" alt="">
      <p class="w-date">11 月 17 日</p>
      <h2>成灿，21 岁生日快乐。</h2>
      <p class="w-sub">给 21 岁的你，许一个生日愿望吧。</p>
      <div id="wish-rows"></div>
      <button id="add-wish" class="add">＋ 再写一条</button>
      <button class="primary" id="w-save">收下愿望</button>
      <button class="w-skip" id="w-skip">先不写，进去看看</button>
    </div>
  </div>

  <div class="overlay" id="photoedit" hidden>
    <div class="w-card">
      <img id="peImg" class="pe-img" alt="">
      <textarea id="peTa" class="ta" placeholder="写一句备注…"></textarea>
      <div class="card-foot"><button class="mini" id="peSave">存下来</button><button class="mini ghost" id="peCancel">算了</button></div>
    </div>
  </div>

  <div class="overlay" id="catname" hidden>
    <div class="w-card">
      <p class="w-date">桌上那只橘猫</p>
      <h2>给它起个名字吧</h2>
      <input id="catNameInput" class="name-input" maxlength="8" placeholder="比如：年糕">
      <div class="card-foot"><button class="mini" id="catNameSave">就叫这个</button><button class="mini ghost" id="catNameSkip">先不想</button></div>
    </div>
  </div>

  <div class="overlay" id="letter" hidden>
    <div class="w-card">
      <p class="w-date">星星信封</p>
      <h2 id="letterTitle">写给 21 岁的自己</h2>
      <ul class="letter-list" id="letterList"></ul>
      <button class="primary" id="letterClose">收好</button>
    </div>
  </div>

  <div class="overlay viewer" id="viewer" hidden>
    <img id="viewerImg" alt="">
    <p class="viewer-note" id="viewerNote"></p>
    <div class="viewer-bar">
      <button class="mini" id="viewerEdit">写一句</button>
    </div>
    <p class="viewer-tip">长按图片可以存到相册</p>
  </div>

  <div class="overlay viewer" id="record" hidden>
    <img id="recordImg" alt="今天的记录">
    <p class="viewer-tip">长按图片可以存到相册</p>
  </div>

  <div class="overlay" id="cardview" hidden>
    <img id="cardimg" alt="祝福卡">
    <p class="cv-hint">长按图片，可以保存</p>
    <div class="cv-bar">
      <button id="card-shuffle">换一张纸</button>
      <button id="card-close">好</button>
    </div>
  </div>

  <div id="toast" role="status"></div>

  <button id="sound" aria-label="声音开关" aria-pressed="true">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path class="wave" d="M16 8.5a5 5 0 010 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
  </button>

</div>
<noscript>
  <p style="position:fixed;inset:0;display:grid;place-items:center;padding:40px;text-align:center;color:#F6E7C8;font-size:15px;line-height:1.8;background:#1B1512;z-index:99;">
    这个页面需要开着 JavaScript 才能看到。<br>换个浏览器再试试吧。
  </p>
</noscript>
<script src="js/audio.js?v=20261113m"></script>
<script src="js/app.js?v=20261116o"></script>
</body>
</html>
